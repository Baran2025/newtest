<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
 <style>
     *
     {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
     }
     body{
        width: 100%;
        height: 100vh;
        background-color: rgb(49, 57, 57);
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
     }
     h1{
        color: greenyellow;
     }
     .inputField{
        width: 450px;
        margin-top: 20px;
        height: 50px;
        border:  2px solid greenyellow;
        display: flex;
        align-items: center;
        justify-content: space-around;
        padding-right: 10px;
     }
     .inputField input{
        width: 80%;
        height: 100%;
        background-color: transparent;
        border: none;
        outline: none;
        color: aliceblue;
        font-size: 18px;
        padding-left: 15px;
     }
     .inputField img{
        width: 30px;
        height: 30px;
        filter: invert(1);
     }
 </style>
</head>
<body>
    <h1>Show And Hide Password</h1>

    <div class="inputField">
        <input type="password" placeholder="Enter Your Password" id="txtpassword">
        <img src="./images/show.png" alt="" onclick="showPassword()" id="myimage">
    </div>
</body>
<script src="./showhide.js"></script>
</html>
