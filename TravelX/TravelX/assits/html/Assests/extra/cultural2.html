<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Website</title>

    <link rel="stylesheet" href="style.css">

    <!-- Bootstrap Link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <!-- Bootstrap Link -->


    <!-- Font Awesome Cdn -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css">
    <!-- Font Awesome Cdn -->


    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap" rel="stylesheet">
    <!-- Google Fonts -->

    <!-- AOS Animation CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
</head>
<body>
  <!-- Section Book Start -->
  <section class="book" id="book">
    <div class="container" data-aos="fade-up">

      <div class="main-text" data-aos="fade-right">
        <h1><span>B</span>ook</h1>
      </div>
      
      <div class="row">

        <div class="col-md-6 py-3 py-md-0" data-aos="zoom-in">
          <div class="card">
            <img src="../images/Colonial Heritage.jpg" alt="">
          </div><br>
          <h3>Colonial Heritage</h3>
              <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Ut, doloribus!</p>
        </div>

        <div class="col-md-6 py-3 py-md-0" data-aos="fade-left">
          <form action="#">

            <input type="text" class="form-control" placeholder="Where To" required><br>
            <input type="text" class="form-control" placeholder="How Many" required><br>
            <input type="date" class="form-control" placeholder="Arrivals" required><br>
            <input type="date" class="form-control" placeholder="Leaving" required><br>
            <textarea class="form-control" rows="5" name="text" placeholder="Enter Your Name & Details"></textarea>
            <input type="submit" value="Book Now" class="submit" required>

          </form>
        </div>

      </div>
    </div>
  </section>
  <!-- Section Book End -->

  <!-- Bootstrap and AOS Script -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>

  <script>
    AOS.init({
      duration: 1200, // Animation duration in milliseconds
      once: true,     // Whether animation should happen only once
    });
  </script>

</body>
</html>
